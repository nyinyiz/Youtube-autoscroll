<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    :root {
      color-scheme: light dark;

      --fs-micro: 11px;
      --fs-label: 12.5px;
      --fs-value: 13px;
      --fs-title: 14px;

      --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px;

      --radius: 8px;

      --bg: #ffffff;
      --bg-raised: #ffffff;
      --text: #14161a;
      --text-2: #5c626a;
      --text-3: #6b7178;
      --line: #e8eaed;
      --line-strong: #d8dce1;
      --track: #dfe2e7;
      --ink: #2b2f34;
      --on: #cc0022;
      --on-hover: #a5001a;
      --ring: #1a73e8;
      --shadow-thumb: 0 1px 3px rgba(16, 20, 26, .32);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1b1c1e;
        --bg-raised: #242527;
        --text: #ecedef;
        --text-2: #a5aab2;
        --text-3: #8d939b;
        --line: #2c2e31;
        --line-strong: #3a3d41;
        --track: #3a3d41;
        --ink: #d7dade;
        --on: #ff5a4d;
        --on-hover: #ff7b70;
        --ring: #8ab4f8;
        --shadow-thumb: 0 1px 3px rgba(0, 0, 0, .55);
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 272px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: var(--fs-label);
      line-height: 1.45;
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }

    ::selection { background: color-mix(in srgb, var(--text) 16%, transparent); }

    /* ---------- Masthead ---------- */
    .masthead {
      display: flex;
      align-items: center;
      gap: var(--s2);
      padding: var(--s3) var(--s4);
    }
    .masthead .mark { width: 18px; height: 18px; border-radius: 4px; flex: none; }
    .masthead h1 {
      font-size: var(--fs-title);
      font-weight: 620;
      letter-spacing: -.01em;
      flex: 1 1 auto;
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .key {
      flex: none;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: var(--fs-micro);
      font-weight: 600;
      color: var(--text-3);
      background: var(--bg-raised);
      border: 1px solid var(--line-strong);
      border-bottom-width: 2px;
      border-radius: 5px;
      padding: 2px 6px;
      white-space: nowrap;
    }

    /* ---------- Primary row ---------- */
    .control {
      display: flex;
      align-items: center;
      gap: var(--s3);
      padding: var(--s2) var(--s4) var(--s4);
    }
    .control-copy { flex: 1 1 auto; min-width: 0; }
    .control-name {
      display: block;
      font-size: var(--fs-value);
      font-weight: 600;
      letter-spacing: -.005em;
    }
    .state {
      display: flex;
      align-items: center;
      gap: 5px;
      margin-top: 1px;
      font-size: var(--fs-micro);
      color: var(--text-3);
    }
    .dot {
      width: 6px;
      height: 6px;
      flex: none;
      border-radius: 50%;
      background: var(--text-3);
      transition: background 180ms cubic-bezier(.2, 0, 0, 1);
    }
    /* Neutral while off: the switch carries the state, not the text */
    .state.on .dot { background: var(--on); }

    /* Switch: styled on the input so it keeps a real focus ring.
       Red appears here and nowhere else. */
    .switch { flex: none; display: block; margin: 0; }
    .switch input {
      appearance: none;
      -webkit-appearance: none;
      display: block;
      position: relative;
      width: 44px;
      height: 25px;
      margin: 0;
      border-radius: 13px;
      background: var(--track);
      cursor: pointer;
      transition: background 180ms cubic-bezier(.2, 0, 0, 1);
    }
    .switch input::after {
      content: '';
      position: absolute;
      top: 3px;
      left: 3px;
      width: 19px;
      height: 19px;
      border-radius: 50%;
      background: #fff;
      box-shadow: var(--shadow-thumb);
      transition: transform 200ms cubic-bezier(.2, 0, 0, 1);
    }
    .switch input:checked { background: var(--on); }
    .switch input:checked::after { transform: translateX(19px); }
    .switch input:hover { background: var(--line-strong); }
    .switch input:checked:hover { background: var(--on-hover); }
    .switch input:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }

    /* ---------- Advanced disclosure ---------- */
    .advanced { border-top: 1px solid var(--line); }

    .advanced-toggle {
      display: flex;
      align-items: center;
      gap: 6px;
      width: 100%;
      padding: var(--s3) var(--s4);
      border: 0;
      background: transparent;
      color: var(--text-2);
      font: inherit;
      font-size: var(--fs-micro);
      font-weight: 600;
      letter-spacing: .04em;
      text-transform: uppercase;
      cursor: pointer;
    }
    .advanced-toggle:hover { color: var(--text); }
    .advanced-toggle:focus-visible { outline: 2px solid var(--ring); outline-offset: -2px; }
    .caret {
      width: 8px;
      height: 8px;
      flex: none;
      margin-left: -2px;
      border-right: 1.5px solid currentColor;
      border-bottom: 1.5px solid currentColor;
      transform: rotate(-45deg);
      transform-origin: center;
      transition: transform 180ms cubic-bezier(.2, 0, 0, 1);
    }
    .advanced-toggle[aria-expanded="true"] .caret { transform: rotate(45deg); }

    /* grid-rows keeps the open/close motion smooth at any content height */
    .advanced-body {
      display: grid;
      grid-template-rows: 0fr;
      transition: grid-template-rows 220ms cubic-bezier(.2, 0, 0, 1);
    }
    .advanced-body.open { grid-template-rows: 1fr; }
    .advanced-inner { overflow: hidden; }
    /* Zero-height alone leaves the controls focusable, so a keyboard user tabs
       into invisible sliders. visibility:hidden removes them from the tab order.
       Delayed on close so it does not cut the collapse animation short. */
    .advanced-body:not(.open) .advanced-inner {
      visibility: hidden;
      transition: visibility 0s linear 220ms;
    }
    .advanced-body.open .advanced-inner {
      visibility: visible;
      transition: visibility 0s linear 0s;
    }

    .fields { padding: 0 var(--s4) var(--s2); }
    .field + .field { margin-top: var(--s3); }

    .field-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: var(--s2);
    }
    .field-head label { font-size: var(--fs-micro); font-weight: 600; color: var(--text-2); }
    .field-value {
      font-size: var(--fs-micro);
      font-weight: 650;
      color: var(--text-2);
      font-variant-numeric: tabular-nums;
    }
    .field-help {
      margin-top: 5px;
      font-size: var(--fs-micro);
      line-height: 1.4;
      color: var(--text-3);
    }

    /* Range: 26px hit area, 3px neutral track, ink fill */
    input[type="range"] {
      appearance: none;
      -webkit-appearance: none;
      display: block;
      width: 100%;
      height: 26px;
      margin: 1px 0 0;
      background:
        linear-gradient(to right,
          var(--ink) 0 var(--pct, 0%),
          var(--track) var(--pct, 0%) 100%)
        center / 100% 3px no-repeat;
      cursor: pointer;
    }
    input[type="range"]::-webkit-slider-runnable-track { height: 3px; background: transparent; }
    input[type="range"]::-webkit-slider-thumb {
      appearance: none;
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      margin-top: -5.5px;
      border-radius: 50%;
      background: var(--ink);
      border: 2px solid var(--bg);
      box-shadow: var(--shadow-thumb);
      transition: transform 140ms cubic-bezier(.2, 0, 0, 1);
    }
    input[type="range"]:hover::-webkit-slider-thumb { transform: scale(1.14); }
    input[type="range"]:active::-webkit-slider-thumb { transform: scale(1.22); }
    input[type="range"]:focus-visible {
      outline: 2px solid var(--ring);
      outline-offset: 1px;
    }
    @supports not (selector(::-webkit-slider-thumb)) {
      input[type="range"] { accent-color: var(--ink); }
    }

    /* ---------- Panel footer: reset + version ---------- */
    .panel-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--s2);
      margin: var(--s1) var(--s4) var(--s4);
    }
    .version {
      flex: none;
      font-size: var(--fs-micro);
      font-weight: 600;
      color: var(--text-3);
      font-variant-numeric: tabular-nums;
    }
    .reset {
      display: block;
      margin: 0;
      padding: 0;
      border: 0;
      background: none;
      color: var(--text-3);
      font: inherit;
      font-size: var(--fs-micro);
      font-weight: 600;
      text-decoration: underline;
      text-underline-offset: 2px;
      text-decoration-color: var(--line-strong);
      cursor: pointer;
      min-height: 24px;
    }
    .reset:hover { color: var(--text); text-decoration-color: currentColor; }
    .reset:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; border-radius: 3px; }
    .reset[disabled] { opacity: .45; cursor: default; text-decoration: none; }
    .reset[disabled]:hover { color: var(--text-3); }

    @media (prefers-reduced-motion: reduce) {
      * { transition-duration: 1ms !important; }
      /* visibility is a discrete switch, not motion: it must be instant or the
         panel stays unreachable to keyboard users while it is collapsed. */
      .advanced-body:not(.open) .advanced-inner { transition-delay: 0s !important; }
    }
  </style>
</head>
<body>
  <header class="masthead">
    <img class="mark" src="icons/icon48.png" width="18" height="18" alt="">
    <h1 data-i18n="popupTitle">YouTube Auto-Scroll</h1>
    <span class="key" id="shortcutKeys"></span>
  </header>

  <section class="control">
    <div class="control-copy">
      <span class="control-name" data-i18n="autoScrollLabel">Auto-scroll</span>
      <span class="state" id="statusText">
        <span class="dot" aria-hidden="true"></span>
        <span id="statusLabel">Paused</span>
      </span>
    </div>
    <label class="switch">
      <input type="checkbox" id="active" aria-describedby="statusLabel">
    </label>
  </section>

  <div class="advanced">
    <button type="button" class="advanced-toggle" id="advancedToggle"
            aria-expanded="false" aria-controls="advancedBody">
      <span class="caret" aria-hidden="true"></span>
      <span data-i18n="advancedLabel">Advanced</span>
    </button>

    <div class="advanced-body" id="advancedBody">
      <div class="advanced-inner">
        <div class="fields">
          <div class="field">
            <div class="field-head">
              <label for="threshold" data-i18n="triggerLabel">Switch before end</label>
              <output class="field-value" for="threshold"><span id="thresholdVal">0.5</span>s</output>
            </div>
            <input type="range" id="threshold" min="0.1" max="3" step="0.1" value="0.5"
                   aria-describedby="thresholdHelp">
            <p class="field-help" id="thresholdHelp" data-i18n="triggerHelp"></p>
          </div>

          <div class="field">
            <div class="field-head">
              <label for="delay" data-i18n="delayLabel">Hold afterwards</label>
              <output class="field-value" for="delay"><span id="delayVal">0.0</span>s</output>
            </div>
            <input type="range" id="delay" min="0" max="5" step="0.5" value="0"
                   aria-describedby="delayHelp">
            <p class="field-help" id="delayHelp" data-i18n="delayHelp"></p>
          </div>
        </div>

        <div class="panel-foot">
          <button type="button" class="reset" id="resetSettings" data-i18n="resetSettingsLabel">Reset settings</button>
          <span class="version" id="version"></span>
        </div>
      </div>
    </div>
  </div>

  <script src="popup-state.js"></script>
  <script src="popup.js"></script>
</body>
</html>
